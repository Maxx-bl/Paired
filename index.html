<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paired</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Screen 1: Choose username ─────────────────────────────────────────── -->
  <div id="screen-login" class="screen active">
    <div class="card">
      <div class="brand">
        <span class="brand-name">Paired</span>
      </div>
      <p class="tagline">Conversation P2P chiffrée, anonyme et éphémère.</p>
      <p class="size-badge">Jusqu'à 10 Go par fichier, téléchargement peer-to-peer.</p>

      <div class="label-row">
        <label class="input-label" for="username-input">Pseudo</label>
        <button id="generate-btn" class="btn-link">Générer</button>
      </div>
      <input id="username-input" type="text" placeholder="ex: legendaryeagle67" maxlength="20" autocomplete="off" spellcheck="false">
      <div id="username-status" class="field-status"></div>

      <button id="next-btn" class="btn-primary" disabled>Continuer</button>
    </div>
  </div>

  <!-- ── Screen 2: Connect to partner ──────────────────────────────────────── -->
  <div id="screen-connect" class="screen">
    <div class="card">
      <button id="back-btn" class="btn-back">Retour</button>

      <div class="my-name-box">
        <span class="input-label">Votre pseudo</span>
        <div class="name-row">
          <strong id="my-username-display" class="my-name"></strong>
          <button id="copy-btn" class="btn-link">Copier</button>
        </div>
        <p class="hint">Partagez ce nom d'utilisateur</p>
      </div>

      <div class="separator">Connexion</div>

      <div class="connect-inputs">
        <input id="partner-input" type="text" placeholder="Pseudo..." maxlength="20" autocomplete="off" spellcheck="false">
        <input id="duration-input" type="number" min="1" max="60" placeholder="60" class="duration-input" title="Durée de session en minutes">
        <span class="duration-unit">min</span>
      </div>
      <div id="connect-status" class="field-status"></div>

      <div id="invitations-list" class="invitations-list"></div>

      <button id="connect-btn" class="btn-primary">Se connecter</button>
    </div>
  </div>

  <!-- ── Screen 3: Chat ────────────────────────────────────────────────────── -->
  <div id="screen-chat" class="screen">

    <div class="chat-header">
      <div class="header-left">
        <div class="presence-dot"></div>
        <span id="chat-with" class="partner-name"></span>
        <span id="conn-type-badge" class="conn-badge" style="display:none"></span>
      </div>
      <div class="header-right">
        <span id="timer" class="timer">60:00</span>
        <button id="leave-btn" class="btn-leave">Quitter</button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div id="drop-overlay" class="drop-overlay">
      <span class="drop-label">Déposer ici</span>
    </div>

    <div id="progress-container" class="progress-wrap" style="display:none">
      <div class="progress-meta">
        <span id="progress-direction" class="progress-dir">Envoi</span>
        <span id="progress-filename" class="progress-name"></span>
        <span id="progress-pct" class="progress-pct">0%</span>
      </div>
      <div class="progress-bar">
        <div id="file-progress" class="progress-fill"></div>
      </div>
    </div>

    <div class="chat-footer">
      <div class="input-row">
        <input id="message-input" type="text" placeholder="Message" autocomplete="off" spellcheck="false">
        <button id="file-btn" class="btn-file" title="Joindre un fichier">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          </svg>
        </button>
        <button id="send-btn" class="btn-send">Envoyer</button>
      </div>
    </div>

  </div>

  <!-- Polyfill crypto.randomUUID pour Android Firefox < 95 -->
  <script>
    if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
      crypto.randomUUID = function() {
        return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
          return (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16);
        });
      };
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
